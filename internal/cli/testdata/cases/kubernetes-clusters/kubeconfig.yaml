apiVersion: v1
kind: Config
current-context: prod-eks
clusters:
  - name: prod
    cluster:
      server: https://ABCDEF.gr7.eu-west-1.eks.amazonaws.com
      certificate-authority-data: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCmZha2UKLS0tLS1FTkQgQ0VSVElGSUNBVEUtLS0tLQo=
  - name: staging
    cluster:
      server: https://GHIJKL.gr7.eu-west-1.eks.amazonaws.com
      certificate-authority-data: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCmZha2UKLS0tLS1FTkQgQ0VSVElGSUNBVEUtLS0tLQo=
  - name: k3d-dev
    cluster:
      server: https://0.0.0.0:6550
      certificate-authority-data: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCmZha2UKLS0tLS1FTkQgQ0VSVElGSUNBVEUtLS0tLQo=
contexts:
  - name: prod-eks
    context:
      cluster: prod
      user: prod-user
  - name: staging
    context:
      cluster: staging
      user: staging-user
  - name: k3d-dev
    context:
      cluster: k3d-dev
      user: k3d-user
users:
  - name: prod-user
    user:
      exec:
        apiVersion: client.authentication.k8s.io/v1beta1
        command: aws
        args: ["eks", "get-token", "--cluster-name", "prod"]
  - name: staging-user
    user:
      exec:
        apiVersion: client.authentication.k8s.io/v1beta1
        command: aws
        args: ["eks", "get-token", "--cluster-name", "staging"]
  - name: k3d-user
    user:
      token: local-static-token
