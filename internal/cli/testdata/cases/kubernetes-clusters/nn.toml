[tools.kubernetes]
kubeconfig = "kubeconfig.yaml"
kubectl = "/usr/local/bin/kubectl"
current = "local"

[tools.kubernetes.clusters.prod]
auth = "service-account"
context = "prod-eks"
service_account = "claude-ro"
service_account_namespace = "apps"

[tools.kubernetes.clusters.staging-eks]
auth = "service-account"
context = "staging"
service_account = "claude-ro"
token_ttl = "30m"

[tools.kubernetes.clusters.local]
auth = "host"
context = "k3d-dev"

# Switched off, as a machine local file would. Neither table reaches a
# provider, so the context that the kubeconfig lacks is never resolved, and
# the profile is the same as without them.
[tools.kubernetes.clusters.retired]
enabled = false
auth = "service-account"
context = "no-such-context"

[tools.github]
enabled = false
