apiVersion: v1
kind: Config
current-context: prod-eks
clusters:
  - name: prod
    cluster:
      server: https://ABCDEF.gr7.eu-west-1.eks.amazonaws.com
      certificate-authority-data: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCmZha2UKLS0tLS1FTkQgQ0VSVElGSUNBVEUtLS0tLQo=
  - name: local
    cluster:
      server: https://127.0.0.1:6443
contexts:
  - name: prod-eks
    context:
      cluster: prod
      user: prod-user
      namespace: default
  - name: local
    context:
      cluster: local
      user: local-user
users:
  - name: prod-user
    user:
      exec:
        apiVersion: client.authentication.k8s.io/v1beta1
        command: aws
        args: ["eks", "get-token", "--cluster-name", "prod"]
  - name: local-user
    user:
      token: local-static-token
