[tools]
go = "1.25"

[tasks.build]
description = "Build the nn binary into bin/"
run = "go build -o bin/nn ."

[tasks.install]
description = "Install nn into the Go bin directory"
run = "go install ."

[tasks.test]
description = "Run the unit and golden tests"
run = "go test ./..."

[tasks.golden]
description = "Rewrite the golden profiles after a change to the generators"
run = "go test ./internal/cli -update"

[tasks.integration]
description = "Run the tests that need the real nono binary"
run = "go test -tags integration ./..."

[tasks.lint]
description = "Report unformatted files and vet problems"
run = ["gofmt -l .", "go vet ./..."]

[tasks.fmt]
description = "Format the source"
run = "gofmt -w ."

[tasks.check]
description = "Everything CI runs"
depends = ["lint", "test"]
