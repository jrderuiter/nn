[tools]
go = "1.27"
# The integration tests validate against this version. The weekly CI run
# tries the latest one, and tells you when to raise it.
nono = "0.79.0"

[tasks.build]
description = "Build the nn binary into bin/"
run = "go build -o bin/nn ."

[tasks.dist]
description = "Build for macOS and Linux, on amd64 and arm64"
run = """
set -eu
version="${VERSION:-$(git describe --tags --always --dirty 2>/dev/null || echo dev)}"
# One reading for all four binaries, so a release is stamped once.
built="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
rm -rf dist
mkdir -p dist
for platform in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
  os="${platform%/*}"
  arch="${platform#*/}"
  out="dist/nn_${os}_${arch}"
  # CGO off so every binary is static and cross builds need no toolchain.
  CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
    -trimpath \
    -ldflags "-s -w \
      -X github.com/jrderuiter/nn/internal/cli.Version=$version \
      -X github.com/jrderuiter/nn/internal/cli.BuildTime=$built" \
    -o "$out" .
  echo "$out"
done
"""

[tasks.install]
description = "Install nn into the Go bin directory"
run = "go install ."

[tasks.test]
description = "Run the unit and golden tests"
run = "go test ./..."

[tasks.golden]
description = "Rewrite the golden profiles after a change to the generators"
run = "go test ./internal/cli -update"

[tasks.integration]
description = "Run the tests that need the real nono binary"
run = "go test -tags integration ./..."

[tasks.packs]
description = "Install the nono packs that the golden profiles extend"
# A built in profile such as "default" has no namespace and needs no pull.
run = """
set -eu
for pack in $(jq -r '.extends[]? // empty' internal/cli/testdata/golden/*.json | grep / | sort -u); do
  nono pull --silent "$pack"
done
"""

[tasks.lint]
description = "Report unformatted files and vet problems"
run = ["gofmt -l .", "go vet ./..."]

[tasks.fmt]
description = "Format the source"
run = "gofmt -w ."

[tasks.check]
description = "Run lint and test together"
depends = ["lint", "test"]
