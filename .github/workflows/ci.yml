name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # A weekly run against the latest nono catches a schema change before a user
  # does.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run check

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: nono --version
      - run: mise run packs
      - run: mise run integration

  integration-latest:
    # Runs only on the schedule. A failure here means that the pinned nono
    # version in mise.toml needs attention, not that the last commit broke.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise use nono@latest
      - run: nono --version
      - run: mise run packs
      - run: mise run integration

  release:
    # Only a version tag publishes binaries. A push to main runs the checks.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
      - run: mise run dist
        env:
          VERSION: ${{ github.ref_name }}
      - run: cd dist && sha256sum nn_* > checksums.txt
      - run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  nightly:
    # Every push to main replaces the nightly release and moves its tag. The tag
    # does not match "v*", so it starts no run of its own.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, integration]
    runs-on: ubuntu-latest
    # A run waits for the one before it, so a cancel never falls between the
    # delete and the create.
    concurrency:
      group: nightly
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: VERSION="nightly-${GITHUB_SHA::7}" mise run dist
      - run: cd dist && sha256sum nn_* > checksums.txt
      - run: gh release delete nightly --cleanup-tag --yes || true
        env:
          GH_TOKEN: ${{ github.token }}
      - run: |
          gh release create nightly dist/* \
            --target "$GITHUB_SHA" \
            --prerelease \
            --latest=false \
            --title "Nightly" \
            --notes "A build of main at $GITHUB_SHA. It can break at any time."
        env:
          GH_TOKEN: ${{ github.token }}
